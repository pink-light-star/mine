  - 미노타우로스의뿔 1 1
  - 별의조각 6to9 1
  - 대족장의도끼 1 0.15
  - exp 900
  Options:
    MovementSpeed: 0.32
    PreventOtherDrops: true
    KnockbackResistance: 1
    AlwaysShowName: true
    Despawn: false

