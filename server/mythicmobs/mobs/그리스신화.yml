  # 돌진
  - message{m="&c[미노타우로스] &f부우우욱!! &7(돌진!)"} @PlayersInRadius{r=40} ~onTimer:120
  - lunge{velocity=2.5;velocityY=0.3} @target ~onTimer:120
  - throw{velocity=10;velocityY=5} @PlayersInRadius{r=3} ~onTimer:125
