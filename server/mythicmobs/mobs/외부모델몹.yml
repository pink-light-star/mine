슈룸링:
  Type: ZOMBIE
  Display: '&d슈룸링'
  Health: 22
  Damage: 4
  Faction: 버섯
  Options:
    Baby: true
    MovementSpeed: 0.3
    PreventOtherDrops: true
    PreventSunburn: true
    Silent: true
  Skills:
  - model{mid=mc_shroomling} @self ~onSpawn
  - state{mid=mc_shroomling;s=attack} @self ~onAttack
  - potion{type=POISON;duration=60;level=0} @target ~onAttack 0.5
  - effect:particles{p=spore_blossom_air;a=10;hS=0.6;vS=0.6} @self ~onTimer:40
  Drops:
  - RED_MUSHROOM 1to2 0.6
  - exp 14

