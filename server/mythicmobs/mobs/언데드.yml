해골_병사:
  Type: SKELETON
  Display: '&7해골 병사'
  Health: 30
  Damage: 6
  Faction: 언데드
  Equipment:
  - IRON_SWORD HAND
  - SHIELD OFFHAND
  - CHAINMAIL_CHESTPLATE CHEST
  - CHAINMAIL_HELMET HEAD
  Skills:
  - potion{type=RESISTANCE;duration=60;level=0} @self ~onDamaged 0.2
  - sound{s=entity.skeleton.ambient;v=1;p=0.6} @self ~onTimer:120 0.5
