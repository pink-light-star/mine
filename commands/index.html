<style>

:root {
  --bg: #eceef6; --panel: #ffffff; --soft: #e3e6f2; --line: #d3d6e6;

  --display: "Gowun Batang", "Apple SD Gothic Neo", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1122; --panel: #161a31; --soft: #1d2240; --line: #2a3054;
  --ink: #e8e9f4; --muted: #9ba0c0; --gold: #e8bd62; --gold-soft: #3a3020; --red: #ff7a6b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1122; --panel: #161a31; --soft: #1d2240; --line: #2a3054;
  --ink: #e8e9f4; --muted: #9ba0c0; --gold: #e8bd62; --gold-soft: #3a3020; --red: #ff7a6b; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 34px/1.15 var(--display); margin: 0; text-wrap: balance; }
h1 span { color: var(--gold); }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 64ch; }
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; margin-top: 14px;
  display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.search { display: flex; gap: 8px; align-items: center; }
.search input { flex: 1; min-width: 0; font: 15px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; }
.search input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.search .n { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump a { font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; }
.jump a:hover, .jump a:focus-visible { color: var(--ink); border-color: var(--gold); outline: none; }
.tip { margin: 18px 0 0; padding: 12px 14px; background: var(--gold-soft); border-radius: 8px; font-size: 14px; }
.tip b { font-family: var(--mono); font-weight: 500; }
section { margin-top: 30px; scroll-margin-top: 130px; }
section h2 { font: 700 20px var(--display); margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
section h2 small { font: 400 13px var(--body); color: var(--muted); }
section.admin h2 { color: var(--red); }
section > p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) minmax(0, 260px); gap: 6px 18px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.cmd { font: 500 14px var(--mono); color: var(--gold); overflow-wrap: anywhere; }
.cmd .arg { color: var(--muted); }
.cmd .al { display: block; font: 400 12px var(--body); color: var(--muted); margin-top: 2px; }
.what { min-width: 0; }
.what .note { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.ex { font: 500 12.5px var(--mono); color: var(--ink); background: var(--soft); border-radius: 6px; padding: 4px 8px; align-self: start; overflow-wrap: anywhere; }
.ex.none { background: none; color: var(--muted); font-family: var(--body); padding: 4px 0; }
@media (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ex { justify-self: start; }
}
.empty { margin-top: 30px; color: var(--muted); }
footer { margin-top: 36px; font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <h1>별빛 <span>명령어</span></h1>
  <p class="sub">별빛 서버에서 쓰는 한국어 명령어를 분류별로 모았어요. 명령어마다 하는 일과 쓰는 법, 예시를 적었어요.</p>
  <p class="tip">헷갈리면 <b>Shift+F</b> 로 메뉴를 열거나 게임 안에서 <b>/명령어</b> 를 입력하세요. <span class="arg">&lt;꺾쇠&gt;</span> 는 꼭 넣는 값, <span class="arg">[대괄호]</span> 는 빼도 되는 값이에요.</p>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="명령어나 기능으로 찾기 (예: 집, 돈, 펫)" aria-label="명령어 찾기"><span class="n" id="n"></span></div>
    <nav class="jump" id="jump" aria-label="분류 바로가기"></nav>
  </div>
  <div id="list"></div>
  <p class="empty" id="empty" hidden>찾는 명령어가 없어요. 다른 낱말로 찾아보세요.</p>
  <footer>관리 명령어는 OP(관리자)만 쓸 수 있어요. 명령어가 바뀌면 이 페이지도 다시 올려요.</footer>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cmdHtml = c => esc(c).replace(/(&lt;[^&]+&gt;|\[[^\]]+\])/g, '<span class="arg">$1</span>');
const total = DATA.reduce((n, s) => n + s.rows.length, 0);

document.getElementById("jump").innerHTML = DATA.map(s => `<a href="#${s.id}">${esc(s.g)}</a>`).join("");
const list = document.getElementById("list");
list.innerHTML = DATA.map(s => `<section id="${s.id}" class="${s.admin ? "admin" : ""}">
  <h2>${esc(s.g)}<small>${s.rows.length}개</small></h2>${s.d ? `<p>${esc(s.d)}</p>` : ""}
  <div class="tbl">${s.rows.map(([c, al, w, note, ex]) => `<div class="row" data-k="${esc((c + " " + al + " " + w + " " + note + " " + s.g).toLowerCase())}">
    <div class="cmd">${cmdHtml(c)}${al ? `<span class="al">${esc(al)}</span>` : ""}</div>
    <div class="what">${esc(w)}${note ? `<span class="note">${esc(note)}</span>` : ""}</div>
    <div class="ex${ex ? "" : " none"}">${ex ? esc(ex) : "그대로 입력"}</div></div>`).join("")}</div></section>`).join("");

const q = document.getElementById("q"), n = document.getElementById("n");
function filter() {
  const v = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section").forEach(sec => {
    let k = 0;
    sec.querySelectorAll(".row").forEach(r => { const ok = !v || r.dataset.k.includes(v); r.hidden = !ok; if (ok) k++; });
    sec.hidden = k === 0; shown += k;
  });
  n.textContent = v ? `${shown} / ${total}개` : `${total}개`;
  document.getElementById("empty").hidden = shown > 0;
}
q.addEventListener("input", filter);
filter();
</script>
